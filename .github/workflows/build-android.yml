name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: awwab-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Gradle wrapper
        run: |
          mkdir -p "$RUNNER_TEMP/gradle-wrapper-project"
          printf "rootProject.name = 'wrapper-generator'\n" > "$RUNNER_TEMP/gradle-wrapper-project/settings.gradle"
          printf "plugins { id 'base' }\n" > "$RUNNER_TEMP/gradle-wrapper-project/build.gradle"
          gradle -p "$RUNNER_TEMP/gradle-wrapper-project" wrapper --gradle-version 8.13
          mkdir -p android/gradle/wrapper
          cp "$RUNNER_TEMP/gradle-wrapper-project/gradlew" android/gradlew
          cp "$RUNNER_TEMP/gradle-wrapper-project/gradlew.bat" android/gradlew.bat
          cp "$RUNNER_TEMP/gradle-wrapper-project/gradle/wrapper/"* android/gradle/wrapper/
          printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-bin.zip\n" > android/gradle/wrapper/gradle-wrapper.properties
          printf "flutter.sdk=%s\n" "$FLUTTER_ROOT" > android/local.properties
          printf "sdk.dir=%s\n" "$ANDROID_HOME" >> android/local.properties
          chmod +x android/gradlew
          android/gradlew -p android --version
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: awwab-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
