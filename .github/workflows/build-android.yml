name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Gradle wrapper
        run: |
          printf "flutter.sdk=%s\n" "$FLUTTER_ROOT" > android/local.properties
          printf "sdk.dir=%s\n" "$ANDROID_HOME" >> android/local.properties
          cd android
          gradle wrapper --gradle-version 8.13
          printf "distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.13-bin.zip\n" > gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew
          ./gradlew --version
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Build APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: awwab-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
