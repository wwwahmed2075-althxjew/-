name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: awwab-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Regenerate Android project with Flutter
        run: |
          rm -rf android
          flutter create --platforms=android --org com.awwab.app --project-name awwab .
          # Re-apply app-specific Android settings after flutter create regenerates android/.
          python3 - <<'PY'
          import re
          from pathlib import Path

          groovy = Path("android/app/build.gradle")
          kotlin = Path("android/app/build.gradle.kts")
          p = groovy if groovy.exists() else kotlin if kotlin.exists() else None
          if p is None:
              raise SystemExit("Flutter did not generate an Android app Gradle file")
          s = p.read_text()
          is_kotlin = p.suffix == ".kts"
          enabled = "isCoreLibraryDesugaringEnabled = true" if is_kotlin else "coreLibraryDesugaringEnabled true"

          def find_block(source, pattern):
              match = re.search(pattern, source, re.MULTILINE)
              if not match:
                  return None
              depth = 1
              i = match.end()
              while i < len(source) and depth:
                  if source[i] == "{":
                      depth += 1
                  elif source[i] == "}":
                      depth -= 1
                  i += 1
              if depth:
                  raise SystemExit("Unclosed Gradle block")
              return match, i

          compile_block = find_block(s, r"^([ \t]*)compileOptions\s*\{")
          if compile_block:
              match, end = compile_block
              if enabled not in s[match.end():end-1]:
                  s = s[:end-1] + "\n            " + enabled + "\n        " + s[end-1:]
          else:
              android_block = find_block(s, r"^([ \t]*)android\s*\{")
              if not android_block:
                  raise SystemExit(f"Could not find android block in {p}")
              match, end = android_block
              indent = match.group(1) + "    "
              if is_kotlin:
                  block = "\n" + indent + "compileOptions {\n" + indent + "    sourceCompatibility = JavaVersion.VERSION_17\n" + indent + "    targetCompatibility = JavaVersion.VERSION_17\n" + indent + "    " + enabled + "\n" + indent + "}\n"
              else:
                  block = "\n" + indent + "compileOptions {\n" + indent + "    sourceCompatibility JavaVersion.VERSION_17\n" + indent + "    targetCompatibility JavaVersion.VERSION_17\n" + indent + "    " + enabled + "\n" + indent + "}\n"
              s = s[:end-1] + block + s[end-1:]

          dependency = ('coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")'
                        if is_kotlin else
                        'coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"')
          if dependency not in s:
              dep_block = find_block(s, r"^dependencies\s*\{")
              if dep_block:
                  match, end = dep_block
                  s = s[:end-1] + "\n    " + dependency + "\n" + s[end-1:]
              else:
                  s += "\ndependencies {\n    " + dependency + "\n}\n"
          p.write_text(s)
          print(f"Configured core library desugaring in {p}")
          PY
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/-all.zip/-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
          sed -i 's#^distributionUrl=.*#distributionUrl=https\\://mirrors.aliyun.com/gradle/distributions/v9.3.1/gradle-9.3.1-bin.zip#' android/gradle/wrapper/gradle-wrapper.properties
          sed -i '/^distributionUrl=/a distributionSha256Sum=553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746' android/gradle/wrapper/gradle-wrapper.properties
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()
          permissions = [
              '<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />',
              '<uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />',
              '<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />',
              '<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />',
              '<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />',
          ]
          for item in permissions:
              if item not in s:
                  s = s.replace('<application', item + chr(10) + '    <application', 1)
          receivers = '''
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationReceiver" />
                  <receiver android:exported="false" android:name="com.dexterous.flutterlocalnotifications.ScheduledNotificationBootReceiver">
                      <intent-filter>
                          <action android:name="android.intent.action.BOOT_COMPLETED" />
                          <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
                          <action android:name="android.intent.action.QUICKBOOT_POWERON" />
                      </intent-filter>
                  </receiver>
          '''
          if 'ScheduledNotificationBootReceiver' not in s:
              s = s.replace('</application>', receivers + chr(10) + '    </application>')
          p.write_text(s)
          PY
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - name: Test offline Quran and prayer calculations
        run: flutter test
      - name: Configure Gradle Maven mirrors
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/awwab-maven-mirrors.gradle" <<'GRADLE'
          // Add mirrors only to Settings repositories. Do not mutate allprojects repositories:
          // Flutter's generated settings may enforce PREFER_SETTINGS.
          settingsEvaluated { settings ->
              settings.pluginManagement.repositories {
                  maven { url "https://maven.aliyun.com/repository/gradle-plugin" }
                  maven { url "https://maven.aliyun.com/repository/central" }
                  maven { url "https://repo.huaweicloud.com/repository/maven/" }
                  gradlePluginPortal()
                  google()
                  mavenCentral()
              }
          }
          GRADLE
      - name: Build APK
        timeout-minutes: 22
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release --target-platform android-arm64 --verbose && exit 0
            echo "Gradle download/build attempt $attempt failed; retrying..."
            sleep 20
          done
          exit 1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: awwab-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
