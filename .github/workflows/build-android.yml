name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: awwab-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Regenerate Android project with Flutter
        run: |
          rm -rf android
          flutter create --platforms=android --org com.awwab.app --project-name awwab .
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml
          sed -i 's/-all.zip/-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties
      - name: Install dependencies
        run: flutter pub get
      - name: Analyze
        run: flutter analyze lib --no-fatal-infos --no-fatal-warnings
      - name: Test offline Quran and prayer calculations
        run: flutter test
      - name: Build APK
        run: |
          for attempt in 1 2 3; do
            flutter build apk --release --target-platform android-arm64 && exit 0
            echo "Gradle download/build attempt $attempt failed; retrying..."
            sleep 20
          done
          exit 1
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: awwab-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
